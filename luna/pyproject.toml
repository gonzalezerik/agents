[project]
name = "luna"
version = "0.1.0"
description = "LUNA - local-first agentic layer over Jira/Discord/Slack for CSUN C3"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pgvector>=0.3.0",
    # --- Chat layer (luna/adapters/discord_adapter.py, slack_adapter.py) ---
    # py-cord, not discord.py: only py-cord ships voice_client.start_recording
    # + discord.sinks, which the /record capability needs (see
    # discord_adapter.py's module docstring). [voice] extra pulls in PyNaCl +
    # davey so voice connect actually works, not just app-command/modal code.
    "py-cord[voice]>=2.8",
    "slack-bolt>=1.30",
    # --- Knowledge layer (luna/adapters/transcript.py, capabilities/rag_qna.py) ---
    "faster-whisper>=1.0",
    "sentence-transformers>=3.0",
    # Garage (S3-compatible) upload for the /record voice-recording handoff
    # (discord_adapter.py's upload_recording_to_garage) -- GARAGE_* config
    # already existed in luna/config.py, this is the client that uses it.
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["luna*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length isn't worth fighting in docstring-heavy modules.
# B008: FastAPI's Depends()-as-a-default-argument is the idiomatic pattern
# (see api/deps.py, api/routes/*.py) -- not the footgun B008 exists to catch.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "luna.decision.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "luna.guardrails"
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "llm: tests that hit the real local LLM endpoint (LLM_BASE_URL); skipped if unreachable",
]
testpaths = ["tests"]
